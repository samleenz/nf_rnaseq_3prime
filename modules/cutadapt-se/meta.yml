name: TRIM_READS
description: Preform reading trimming of low quality sequences (phred < 20) 
  and adapters as per lexogen instructions (https://faqs.lexogen.com/faq/what-sequences-should-be-trimmed)
tools:
  - cutadapt:
      homepage: https://github.com/marcelm/cutadapt
      docs: https://cutadapt.readthedocs.io/en/stable/guide.html
input:
  - sample:
      type: val 
      decsription: Sample identifier
  - reads:
      type: file
      decsription: Input fastq file
output:
  - sample:
      type: val 
      decsription: Sample identifier
  - reads:
      type: file
      decsription: trimmed fastq file
authors: 
  - "@samleenz"